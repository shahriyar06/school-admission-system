# Docker er vitore backend DB te jay service name `db` ar port 5432 diye।
# Host er 5433 port sudhu local development (dotnet run / dotnet test) er jonno.

# backend ar backend2 er common config, duibar likhte hobe na
x-backend: &backend
  build:
    context: ./backend
    target: final
  image: school-admission-backend:latest
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped
  environment:
    # Kerberos (GSS) lage na; na dile Npgsql libgssapi khuje log e error dekhay
    ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-admission};Username=${POSTGRES_USER:-admission};Password=${POSTGRES_PASSWORD:-admission};GSS Encryption Mode=Disable
    HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ASPNETCORE_ENVIRONMENT: Production

services:
  db:
    image: postgres:16-alpine
    container_name: school-admission-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admission}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admission}
      POSTGRES_DB: ${POSTGRES_DB:-admission}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    <<: *backend
    container_name: school-admission-backend
    ports:
      - "8080:8080"

  # Bonus multi-instance: ekoi DB te ditiyo ekta backend process (port 8081)
  # chalu: docker compose --profile multi up -d --build
  backend2:
    <<: *backend
    container_name: school-admission-backend-2
    ports:
      - "8081:8080"
    profiles: ["multi"]

  # Integration test Docker er vitorei: docker compose --profile test run --rm tests
  tests:
    build:
      context: ./backend
      target: test
    profiles: ["test"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      TEST_DB_CONNECTION: Host=db;Port=5432;Username=${POSTGRES_USER:-admission};Password=${POSTGRES_PASSWORD:-admission};GSS Encryption Mode=Disable

  # Frontend er test (Vitest + MSW) Docker er vitorei: docker compose --profile test run --rm frontend-test
  # MSW fake backend use kore, tai db / backend lage na
  frontend-test:
    build:
      context: ./frontend
      target: test
    profiles: ["test"]

  # React app (nginx), browser e kholo: http://localhost:3000
  frontend:
    build:
      context: ./frontend
      target: final
    container_name: school-admission-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      # API call kore user er browser (host e), container na। Tai host theke jaoa jay emon URL
      # (http://localhost:8080) dite hobe, http://backend:8080 browser chinbe na
      API_URL: ${API_URL:-http://localhost:8080}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
